name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Проверка наличия Node ---
      - name: Check for package.json
        id: check_node
        run: |
          if [ -f "package.json" ]; then
            echo "has_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_node=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check_node.outputs.has_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (npm)
        if: steps.check_node.outputs.has_node == 'true'
        run: npm ci

      - name: Build assets (vite)
        if: steps.check_node.outputs.has_node == 'true'
        run: npm run build          # vite build → создаёт dist/ с manifest.json


      # --- Проверка наличия Composer ---
      - name: Check for composer.json
        id: check_composer
        run: |
          if [ -f "composer.json" ]; then
            echo "has_composer=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_composer=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP
        if: steps.check_composer.outputs.has_composer == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies (composer)
        if: steps.check_composer.outputs.has_composer == 'true'
        run: composer install --no-dev --optimize-autoloader



      # --- Собираем ZIP с правильной структурой ---
      - name: Build ZIP
        run: |
          THEME_SLUG="${GITHUB_REPOSITORY##*/}"
          mkdir -p "${GITHUB_WORKSPACE}/release"
          rsync -av . "/tmp/${THEME_SLUG}/" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "*.config.js" \
            --exclude "*.config.ts" \
            --exclude "package*.json" \
            --exclude "composer.json" \
            --exclude "composer.lock" \
            --exclude ".gitignore" \
            --exclude "*.md"
          # dist/ и vendor/ НЕ исключаем — они уже собраны и нужны в ZIP

          cd /tmp
          zip -r "${GITHUB_WORKSPACE}/release/${THEME_SLUG}.zip" "${THEME_SLUG}/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
